# Copy this file to data/objects.yaml and edit it for your dataset.
#
# Expected layout (standard YOLO format):
#   datasets/my-objects/
#     images/train/*.jpg
#     images/val/*.jpg
#     labels/train/*.txt
#     labels/val/*.txt
#
# Each label file contains one line per object:
#   <class-index> <x-center> <y-center> <width> <height>
# with coordinates normalised to 0..1.

path: /absolute/path/to/datasets/my-objects
train: images/train
val: images/val

# List every class your dataset labels, in index order.
names:
  0: person
  1: cup
  2: bottle
  3: book
  4: chair
  5: fan
  6: laptop
  7: phone
